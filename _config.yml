# Site settings
title: "Kitae Kim's Homepage"
description: #"A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar: "true"
resume_name: "Kitae Kim"
resume_title: "About Me"

# used for the contact button in _layouts/resume.html
resume_contact_email: "kim3686@purdue.edu"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:
resume_contact_address: "Purdue University, IN"

resume_header_contact_info: "Purdue University, IN • <a href='mailto:kim3686@purdue.edu'>kim3686@purdue.edu</a>"
display_header_contact_info: "true"

resume_header_intro: "<p>Hi! I earned my Ph.D. in Mechanical Engineering at Purdue University, specializing in robotics and automation in <a href='https://multiscalerobotics.org/' target='_blank'>Multi-Scale Robotics and Automation Lab</a> directed by Prof. David J. Cappelleri. My research focuses on the development of an intelligent mobile robotic systems for sustainable and precision agriculture, especially on robot autonomy including localization, perception, and autonomous navigation. In 2025, I had an internship at Nokia Bell Labs. During my internship, I have contributed to design algorithms for vision-based drone localization in large-scale warehouse environments to monitor inventories autonomously. </p>"

# resume_header_intro: "<p>This is the executive summary. You should write a few brief, concise, and meaningful sentences about yourself from a professional context, and your immediate career goals. Make the length appropriate for your needs, but keep it brief and concise</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work: "yes"

# Decide which sections to use
# comment out to hide
resume_section_news: true
resume_section_education: true
resume_section_industry_experience: true
resume_section_publications: true
resume_section_projects: true
resume_section_media: true
resume_section_awards: true
# resume_section_experience:      false
# resume_section_skills:          false
# resume_section_recognition:     false
# resume_section_links:           false
# resume_section_associations:    false
# resume_section_interests:       true

